# CI (#152): i controlli che esistono già, eseguiti da soli su ogni PR e su
# master. Prima giravano solo quando qualcuno li lanciava a mano — ed è così
# che l'avviso critico di Next 16.3.1 è rimasto invisibile (#151).
#
# ⚠️ Un checkout pulito è anche la risposta alla trappola della #114: il dev
# server accumula le classi Tailwind già generate e può nascondere una classe
# mancante; qui `audit:tokens` misura solo ciò che il codice genera davvero.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Una spinta nuova su una PR annulla il giro precedente della stessa PR.
# ⚠️ Su master NO: due merge ravvicinati annullerebbero il controllo del
# primo commit, che resterebbe per sempre senza un esito (code review #183).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifica:
    # Il nome del job è quello che la protezione di `master` richiede verde:
    # cambiarlo vuol dire aggiornare anche la regola del ramo.
    name: verifica
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # `bash` esplicito = `-eo pipefail`: senza, `npm ci | tee` uscirebbe
        # col codice di `tee` e un'installazione fallita passerebbe.
        shell: bash
    env:
      # ⚠️ `next.config.ts` si ferma senza queste due, e le NEXT_PUBLIC_* sono
      # inlinizzate in compilazione: con valori fittizi la build NON è
      # pubblicabile, ed è giusto così — serve solo a verificare. Nessun
      # segreto vero in questo file.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # La versione di Node la dice `engines.node` in package.json, la stessa
      # che Vercel usa per la produzione: una fonte sola, così CI e produzione
      # non possono girare su due Node diversi senza che lo dica un file.
      # npm 11 (Node 24) serve anche per `allowScripts`.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      # ⚠️ `allowScripts` approva versioni ESATTE: un aggiornamento che porta
      # uno script d'installazione nuovo non lo esegue e lo dice solo con un
      # avviso. In locale è un avviso che scorre via; qui è un errore, così una
      # PR di Dependabot non passa con uno script mai vagliato.
      #
      # ⚠️⚠️ Si cerca la FRASE, e solo lei. npm 11.16 scrive `npm warn
      # allow-scripts …`, npm 11.19 `npm warn install-scripts …`: la prima
      # versione di questo controllo cercava `allow-scripts` e passava verde
      # con esbuild tolto da allowScripts (l'ha trovato la controprova). Il
      # prefisso da solo no: un avviso informativo con lo stesso prefisso
      # farebbe fallire ogni PR per un motivo che non c'è (code review #183).
      - name: Installazione
        run: |
          npm ci 2>&1 | tee npm-ci.log
          if grep -qi "not yet covered by allowScripts" npm-ci.log; then
            echo "::error::Uno script d'installazione non è approvato in allowScripts: leggilo, poi 'npm approve-scripts <pacchetto>'."
            exit 1
          fi

      - name: Tipi
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Il lint verde dice solo che l'app non ha violazioni: questo controlla
      # che le regole scattino ancora (PR #185, plugin con il peer forzato).
      - name: Audit delle regole ESLint
        run: npm run audit:eslint-rules

      - name: Build
        run: npm run build

      # Vuole la build di produzione appena fatta: senza, dichiara di non aver
      # guardato invece di passare.
      - name: Audit dei token
        run: npm run audit:tokens

      - name: Audit della cache PWA
        run: npm run audit:pwa-cache

      # L'intero albero, strumenti di sviluppo compresi, e solo da "alto" in su.
      # ⚠️ Non `--omit=dev`: esbuild, Tailwind e Serwist girano durante
      # `next build`, anche su Vercel, e un avviso alto lì passerebbe senza una
      # parola (code review #183). I moderati restano fuori: quelli di
      # glob/minimatch dentro Serwist sono accettati e spiegati in CLAUDE.md.
      - name: Avvisi di sicurezza
        run: npm audit --audit-level=high
