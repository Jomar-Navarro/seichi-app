# CI (#152): i controlli che esistono già, eseguiti da soli su ogni PR e su
# master. Prima giravano solo quando qualcuno li lanciava a mano — ed è così
# che l'avviso critico di Next 16.3.1 è rimasto invisibile (#151).
#
# ⚠️ Un checkout pulito è anche la risposta alla trappola della #114: il dev
# server accumula le classi Tailwind già generate e può nascondere una classe
# mancante; qui `audit:tokens` misura solo ciò che il codice genera davvero.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    # Il nome del job è quello che la protezione di `master` richiede verde:
    # cambiarlo vuol dire aggiornare anche la regola del ramo.
    name: verifica
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # `bash` esplicito = `-eo pipefail`: senza, `npm ci | tee` uscirebbe
        # col codice di `tee` e un'installazione fallita passerebbe.
        shell: bash
    env:
      # ⚠️ `next.config.ts` si ferma senza queste due, e le NEXT_PUBLIC_* sono
      # inlinizzate in compilazione: con valori fittizi la build NON è
      # pubblicabile, ed è giusto così — serve solo a verificare. Nessun
      # segreto vero in questo file.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # La stessa versione di Node del lavoro in locale (`.nvmrc`). npm 11 serve
      # anche per `allowScripts` in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # ⚠️ `allowScripts` approva versioni ESATTE: un aggiornamento che porta
      # uno script d'installazione nuovo non lo esegue e lo dice solo con un
      # `npm warn allow-scripts`. In locale è un avviso che scorre via; qui è un
      # errore, così una PR di Dependabot non passa con uno script mai vagliato.
      - name: Installazione
        run: |
          npm ci 2>&1 | tee npm-ci.log
          if grep -q "allow-scripts" npm-ci.log; then
            echo "::error::Uno script d'installazione non è approvato in allowScripts: leggilo, poi 'npm approve-scripts <pacchetto>'."
            exit 1
          fi

      - name: Tipi
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Vuole la build di produzione appena fatta: senza, dichiara di non aver
      # guardato invece di passare.
      - name: Audit dei token
        run: npm run audit:tokens

      - name: Audit della cache PWA
        run: npm run audit:pwa-cache

      # Solo dipendenze di produzione e solo da "alto" in su: i due moderati di
      # glob/minimatch dentro Serwist sono accettati e spiegati in CLAUDE.md.
      - name: Avvisi di sicurezza
        run: npm audit --omit=dev --audit-level=high
