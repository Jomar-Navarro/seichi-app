# Aggiornamenti delle dipendenze (#151).
#
# L'avviso critico di Next 16.3.1 è rimasto invisibile finché nessuno ha
# lanciato `npm audit` a mano: da qui un giro automatico a settimana.
#
# - Minori e patch arrivano in UNA PR raggruppata: una per pacchetto sarebbero
#   dieci PR a settimana, e il rumore fa smettere di leggerle.
# - Le maggiori arrivano una per volta, perché ognuna va letta.
# - ⚠️ Next ha una PR SUA anche per le minori, insieme a eslint-config-next che
#   lo segue: in questo repo ogni versione di Next va letta nei doc in
#   node_modules/next/dist/docs (regola in testa a CLAUDE.md), e dentro la PR
#   raggruppata sarebbe una riga fra dieci.
# - ⚠️ esbuild ha una PR sua: `allowScripts` in package.json ne approva la
#   versione ESATTA, quindi anche una patch lascia il suo script non eseguito
#   finché qualcuno non lo approva. Il build dipende dall'esbuild nativo
#   (Fase 25). @swc/core ha lo stesso vincolo ma arriva da Serwist: cambia
#   solo nella PR che aggiorna Serwist.
# - Gli aggiornamenti di SICUREZZA non aspettano il lunedì: li apre Dependabot
#   appena esce l'avviso (impostazione del repository, non di questo file).
#
# ⚠️ Una PR di Dependabot non si mergia sulla fiducia: `allowScripts` in
# package.json è legato alla versione esatta, quindi un pacchetto con uno
# script d'installazione nuovo va vagliato (`npm approve-scripts <pkg>`) e la
# PR va provata come qualunque altra.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Dependabot assegna ogni pacchetto al PRIMO gruppo che lo comprende:
      # "next" deve stare sopra "minori-e-patch".
      next:
        applies-to: version-updates
        patterns:
          - "next"
          - "eslint-config-next"
      minori-e-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "esbuild"
    ignore:
      # I tipi di Node restano sulla 20, la versione minima che il codice
      # assume. ⚠️ Il Node su cui gira davvero l'app è un'impostazione del
      # progetto Vercel e oggi non è scritto nel repo (né `engines` né
      # .nvmrc): va fissato insieme alla CI (#152), e da lì questi tipi lo
      # seguiranno. Fino ad allora un salto di maggiore descriverebbe API
      # che a runtime potrebbero non esserci.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
